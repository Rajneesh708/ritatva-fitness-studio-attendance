<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F3F1F" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Ritatva Fitness Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #F5F1E8 0%, #FFFFFF 100%);
      min-height: 100vh;
      color: #1a1a1a;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    /* Logo header */
    .logo-header {
      text-align: center;
      padding: 20px 0 10px;
      margin-bottom: 16px;
    }
    .logo-header img {
      max-width: 180px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Mode tabs */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #FFFFFF;
      border: 2px solid #E8E2D0;
      border-radius: 14px;
      padding: 6px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 14px 12px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #666666;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #0F3F1F;
      color: #FFFFFF;
    }

    /* Form card */
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    .form-title {
      font-size: 18px;
      font-weight: 700;
      color: #0F3F1F;
      margin-bottom: 6px;
    }
    .form-subtitle {
      font-size: 13px;
      color: #666666;
      margin-bottom: 20px;
    }

    /* Inputs */
    .field { margin-bottom: 16px; position: relative; }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .input, .select {
      width: 100%;
      padding: 14px 14px;
      border: 1.5px solid #E5E0D0;
      border-radius: 10px;
      font-size: 16px;
      color: #1a1a1a;
      background: #FFFFFF;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .input:focus, .select:focus {
      outline: none;
      border-color: #0F3F1F;
      box-shadow: 0 0 0 3px rgba(15, 63, 31, 0.1);
    }
    .input.locked {
      background: #F5F1E8;
      color: #666666;
      pointer-events: none;
    }

    /* Suggestions dropdown */
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1.5px solid #E5E0D0;
      border-radius: 10px;
      margin-top: 4px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      display: none;
    }
    .suggestions.visible { display: block; }
    .suggestion-item {
      padding: 12px 14px;
      font-size: 15px;
      cursor: pointer;
      border-bottom: 1px solid #F5F1E8;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover, .suggestion-item.highlighted {
      background: #F5F1E8;
      color: #0F3F1F;
    }
    .suggestion-item .mobile {
      font-size: 12px;
      color: #999999;
      margin-top: 2px;
    }
    .suggestions-empty {
      padding: 16px;
      text-align: center;
      color: #999999;
      font-size: 14px;
    }

    /* Absence type radio */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .radio-option {
      display: flex;
      align-items: center;
      padding: 14px 14px;
      border: 1.5px solid #E5E0D0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: #FFFFFF;
    }
    .radio-option.selected {
      border-color: #0F3F1F;
      background: #F0F7F1;
    }
    .radio-option input {
      margin-right: 12px;
      accent-color: #0F3F1F;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .radio-option label {
      flex: 1;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
      line-height: 1.4;
    }
    .radio-option label .date-hint {
      display: block;
      font-size: 12px;
      color: #666666;
      font-weight: 400;
      margin-top: 2px;
    }
    .radio-option.selected label .date-hint {
      color: #1E6B3A;
    }

    /* Date range */
    .date-range {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    .date-range.visible {
      display: grid;
    }
    .date-range > div { display: flex; flex-direction: column; }
    .date-range label {
      font-size: 12px;
      color: #666666;
      margin-bottom: 4px;
      font-weight: 500;
    }

    /* Range summary */
    .range-summary {
      display: none;
      background: #F0F7F1;
      border: 1px solid #C9E5C9;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 13px;
      color: #1E6B3A;
      line-height: 1.5;
    }
    .range-summary.visible { display: block; }
    .range-summary strong { font-weight: 700; }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #0F3F1F;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    /* Status messages */
    .status {
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 16px;
      text-align: center;
      display: none;
    }
    .status.visible { display: block; }
    .status.success {
      background: #E8F5E8;
      color: #1E6B3A;
      border: 1px solid #C9E5C9;
    }
    .status.error {
      background: #FDECEA;
      color: #C73E1D;
      border: 1px solid #F5C2B8;
    }
    .status.loading {
      background: #F5F1E8;
      color: #666666;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #999999;
      border-top-color: #0F3F1F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Connection warning */
    .conn-warn {
      display: none;
      background: #FFF8E1;
      border: 1px solid #FFE082;
      color: #8C6D00;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      text-align: center;
    }
    .conn-warn.visible { display: block; }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 24px;
      padding: 16px;
      font-size: 12px;
      color: #999999;
    }

    /* Today's date display */
    .today {
      background: #F5F1E8;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #666666;
      margin-bottom: 16px;
      text-align: center;
    }
    .today strong { color: #0F3F1F; }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo-header">
      <img src="logo.png" alt="Ritatva Fitness Studio" />
    </div>

    <div class="conn-warn" id="conn-warn">
      ⏳ Loading member list... This can take up to 20 seconds on first load. Please wait — do NOT refresh.
    </div>

    <div class="mode-tabs">
      <button class="tab-btn active" data-mode="attendance" onclick="switchMode('attendance')">
        ✓ I'm Here Today
      </button>
      <button class="tab-btn" data-mode="absence" onclick="switchMode('absence')">
        ✗ Can't Attend
      </button>
    </div>

    <div class="card">
      <div id="form-attendance">
        <div class="form-title">Mark Attendance</div>
        <div class="form-subtitle">Scan complete — fill below to mark your presence</div>
        <div class="today">Today is <strong id="today-date-1"></strong></div>

        <div class="field">
          <label class="label">Your Name</label>
          <input type="text" id="name-att" class="input" autocomplete="off" placeholder="Type 2-3 letters of your name..." />
          <div class="suggestions" id="suggestions-att"></div>
        </div>

        <div class="field">
          <label class="label">Mobile Number</label>
          <input type="tel" id="mobile-att" class="input" inputmode="numeric" autocomplete="off" placeholder="Type 2-4 digits to search..." />
          <div class="suggestions" id="mob-suggestions-att"></div>
        </div>

        <div class="field">
          <label class="label">Your Batch</label>
          <select id="batch-att" class="select">
            <option value="">Select batch</option>
            <option value="6:00 AM">6:00 AM</option>
            <option value="7:00 AM">7:00 AM</option>
            <option value="8:00 AM">8:00 AM</option>
            <option value="9:00 AM">9:00 AM</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="11:00 AM">11:00 AM</option>
            <option value="5:30 PM">5:30 PM</option>
            <option value="6:30 PM">6:30 PM</option>
            <option value="7:30 PM">7:30 PM</option>
            <option value="8:30 PM">8:30 PM</option>
            <option value="9:30 PM">9:30 PM</option>
          </select>
        </div>

        <button id="submit-att" class="submit-btn" onclick="submitAttendance()">Mark My Attendance ✓</button>
        <div class="status" id="status-att"></div>
      </div>

      <div id="form-absence" style="display:none;">
        <div class="form-title">Report Absence</div>
        <div class="form-subtitle">Let us know you can't attend</div>

        <div class="field">
          <label class="label">Your Name</label>
          <input type="text" id="name-abs" class="input" autocomplete="off" placeholder="Type 2-3 letters of your name..." />
          <div class="suggestions" id="suggestions-abs"></div>
        </div>

        <div class="field">
          <label class="label">Mobile Number</label>
          <input type="tel" id="mobile-abs" class="input" inputmode="numeric" autocomplete="off" placeholder="Type 2-4 digits to search..." />
          <div class="suggestions" id="mob-suggestions-abs"></div>
        </div>

        <div class="field">
          <label class="label">When You Won't Attend</label>
          <div class="radio-group">
            <div class="radio-option selected" id="radio-opt-today" onclick="selectAbsenceType('today')">
              <input type="radio" name="absence-type" value="today" id="absence-today" checked />
              <label for="absence-today">
                I won't attend today
                <span class="date-hint" id="today-hint"></span>
              </label>
            </div>
            <div class="radio-option" id="radio-opt-range" onclick="selectAbsenceType('range')">
              <input type="radio" name="absence-type" value="range" id="absence-range" />
              <label for="absence-range">
                I won't attend for multiple days
                <span class="date-hint">Select a date range below</span>
              </label>
            </div>
          </div>

          <div class="date-range" id="date-range-block">
            <div>
              <label>From</label>
              <input type="date" id="date-from" class="input" />
            </div>
            <div>
              <label>To</label>
              <input type="date" id="date-to" class="input" />
            </div>
          </div>

          <div class="range-summary" id="range-summary"></div>
        </div>

        <div class="field">
          <label class="label">Your Batch</label>
          <select id="batch-abs" class="select">
            <option value="">Select batch</option>
            <option value="6:00 AM">6:00 AM</option>
            <option value="7:00 AM">7:00 AM</option>
            <option value="8:00 AM">8:00 AM</option>
            <option value="9:00 AM">9:00 AM</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="11:00 AM">11:00 AM</option>
            <option value="5:30 PM">5:30 PM</option>
            <option value="6:30 PM">6:30 PM</option>
            <option value="7:30 PM">7:30 PM</option>
            <option value="8:30 PM">8:30 PM</option>
            <option value="9:30 PM">9:30 PM</option>
          </select>
        </div>

        <button id="submit-abs" class="submit-btn" onclick="submitAbsence()">Submit Absence</button>
        <div class="status" id="status-abs"></div>
      </div>
    </div>

    <div class="footer">
      For queries, contact Sneha directly via WhatsApp
    </div>

  </div>

  <script>
    // ========================================
    // CONFIGURATION - PASTE YOUR APPS SCRIPT URL HERE
    // ========================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8jPBJTarJiyWMyUJa7tiUP3JsQRDT9oJ886EkWlaExNdHf6E1IDqnslSMkF6qpIdZ/exec";

    // ========================================
    // MEMBER DATA - Auto-loaded from Apps Script
    // ========================================
    let members = []; // Will be filled with {name, mobile} objects
    let loadAttempts = 0;
    const MAX_ATTEMPTS = 8;
    const RETRY_DELAYS = [3000, 3000, 4000, 4000, 5000, 5000, 5000];

    // Day names and month names
    const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    // Format date as "Tue, 28 May 2026"
    function formatDateFull(d) {
      return dayNames[d.getDay()].substring(0,3) + ", " + 
             String(d.getDate()).padStart(2, '0') + " " + 
             monthNames[d.getMonth()] + " " + 
             d.getFullYear();
    }

    // Format date as "28 May 2026"
    function formatDateShort(d) {
      return String(d.getDate()).padStart(2, '0') + " " + 
             monthNames[d.getMonth()] + " " + 
             d.getFullYear();
    }

    // Build a yyyy-mm-dd string from a Date using LOCAL parts (TZ-safe; avoids
    // the UTC shift that toISOString() can introduce around midnight in IST).
    function localDateStr(d) {
      return d.getFullYear() + '-' +
             String(d.getMonth() + 1).padStart(2, '0') + '-' +
             String(d.getDate()).padStart(2, '0');
    }

    // Parse a yyyy-mm-dd string into a LOCAL-midnight Date.
    function parseLocalDate(s) {
      const p = String(s).split('-');
      return new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
    }

    // Set today's date in UI
    function setToday() {
      const today = new Date();
      const display = formatDateFull(today);
      document.getElementById('today-date-1').textContent = display;
      document.getElementById('today-hint').textContent = display;

      // Default range to tomorrow
      const tomorrow = new Date(today);
      tomorrow.setDate(today.getDate() + 1);
      const todayStr = today.toISOString().split('T')[0];
      const tomorrowStr = tomorrow.toISOString().split('T')[0];
      
      const dateFrom = document.getElementById('date-from');
      const dateTo = document.getElementById('date-to');
      dateFrom.value = tomorrowStr;
      dateTo.value = tomorrowStr;
      dateFrom.min = todayStr; // Cannot pick past dates
      dateTo.min = todayStr;
      
      dateFrom.addEventListener('change', updateRangeSummary);
      dateTo.addEventListener('change', updateRangeSummary);
    }

    // Update range summary text
    function updateRangeSummary() {
      const type = document.querySelector('input[name="absence-type"]:checked').value;
      const summary = document.getElementById('range-summary');
      
      if (type !== 'range') {
        summary.classList.remove('visible');
        return;
      }

      const fromStr = document.getElementById('date-from').value;
      const toStr = document.getElementById('date-to').value;
      
      if (!fromStr || !toStr) {
        summary.classList.remove('visible');
        return;
      }
      
      const fromDate = new Date(fromStr);
      const toDate = new Date(toStr);
      
      if (fromDate > toDate) {
        summary.innerHTML = '<strong>⚠️ Error:</strong> "From" date must be on or before "To" date';
        summary.classList.add('visible');
        return;
      }

      const days = Math.round((toDate - fromDate) / (1000 * 60 * 60 * 24)) + 1;
      summary.innerHTML = '<strong>You are reporting absence for ' + days + ' day' + (days > 1 ? 's' : '') + ':</strong><br>' + 
                         formatDateShort(fromDate) + ' to ' + formatDateShort(toDate);
      summary.classList.add('visible');
    }

    // Switch between attendance and absence modes
    function switchMode(mode) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-mode="' + mode + '"]').classList.add('active');
      document.getElementById('form-attendance').style.display = mode === 'attendance' ? 'block' : 'none';
      document.getElementById('form-absence').style.display = mode === 'absence' ? 'block' : 'none';
      // Hide any status messages when switching
      document.getElementById('status-att').className = 'status';
      document.getElementById('status-abs').className = 'status';
    }

    // Select absence type (today or range)
    function selectAbsenceType(type) {
      document.getElementById('radio-opt-today').classList.toggle('selected', type === 'today');
      document.getElementById('radio-opt-range').classList.toggle('selected', type === 'range');
      document.getElementById('absence-today').checked = type === 'today';
      document.getElementById('absence-range').checked = type === 'range';
      document.getElementById('date-range-block').classList.toggle('visible', type === 'range');
      updateRangeSummary();
    }

    // Load members from Apps Script with auto-retry
    async function loadMembers() {
      loadAttempts++;
      document.getElementById('conn-warn').classList.add('visible');
      
      try {
        // Add timestamp to prevent API caching
        const res = await fetch(APPS_SCRIPT_URL + '?action=getMembers&t=' + Date.now());
        const data = await res.json();
        
        if (data.members && data.members.length > 0) {
          members = data.members;
          document.getElementById('conn-warn').classList.remove('visible');
        } else {
          if (loadAttempts < MAX_ATTEMPTS) {
            setTimeout(loadMembers, RETRY_DELAYS[loadAttempts - 1] || 5000);
          } else {
            document.getElementById('conn-warn').innerHTML = 
              '⚠️ Could not load member list. Please refresh the page or contact Sneha.';
          }
        }
      } catch (err) {
        console.error('Failed to load members:', err);
        if (loadAttempts < MAX_ATTEMPTS) {
          setTimeout(loadMembers, RETRY_DELAYS[loadAttempts - 1] || 5000);
        } else {
          document.getElementById('conn-warn').innerHTML = 
            '⚠️ Network issue. Please check your internet and refresh the page.';
        }
      }
    }

    // Setup autocomplete for NAME inputs
    function setupNameAutocomplete(inputId, suggestionsId) {
      const input = document.getElementById(inputId);
      const suggestions = document.getElementById(suggestionsId);
      let matches = [];

      input.addEventListener('input', () => {
        const query = input.value.toLowerCase().trim();
        
        if (query.length < 2) {
          suggestions.classList.remove('visible');
          suggestions.innerHTML = '';
          return;
        }

        matches = members.filter(m => 
          m.name.toLowerCase().includes(query)
        ).slice(0, 8);

        if (matches.length === 0) {
          suggestions.innerHTML = '<div class="suggestions-empty">No matching member found</div>';
          suggestions.classList.add('visible');
          return;
        }

        // Only show names - no mobile numbers in suggestions
        suggestions.innerHTML = matches.map((m, i) => 
          '<div class="suggestion-item" data-index="' + i + '">' +
          '<div>' + escapeHtml(m.name) + '</div>' +
          '</div>'
        ).join('');
        suggestions.classList.add('visible');

        suggestions.querySelectorAll('.suggestion-item').forEach((item, i) => {
          item.addEventListener('click', () => {
            input.value = matches[i].name;
            suggestions.classList.remove('visible');
          });
        });
      });

      input.addEventListener('blur', () => {
        setTimeout(() => suggestions.classList.remove('visible'), 200);
      });

      input.addEventListener('focus', () => {
        if (input.value.trim().length >= 2 && suggestions.innerHTML) {
          suggestions.classList.add('visible');
        }
      });
    }

    // Setup autocomplete for MOBILE inputs (requires name to be selected first)
    function setupMobileAutocomplete(inputId, suggestionsId, nameInputId) {
      const input = document.getElementById(inputId);
      const suggestions = document.getElementById(suggestionsId);
      const nameInput = document.getElementById(nameInputId);
      let matches = [];

      // Block typing if name is not filled
      input.addEventListener('focus', () => {
        const enteredName = nameInput.value.trim();
        if (!enteredName) {
          input.blur();
          alert('Please fill in this order:\n\n1. Your Name\n2. Mobile Number\n3. Batch\n\nPlease enter your name first.');
          nameInput.focus();
          return;
        }
        if (input.value.trim().length >= 2 && suggestions.innerHTML) {
          suggestions.classList.add('visible');
        }
      });

      input.addEventListener('input', () => {
        const query = input.value.replace(/\D/g, '').trim();
        
        if (query.length < 2) {
          suggestions.classList.remove('visible');
          suggestions.innerHTML = '';
          return;
        }

        // Show all matching mobiles - members will see only digits, no names
        matches = members.filter(m => {
          if (!m.mobile) return false;
          const mobileNorm = normalizeMobile(m.mobile);
          return mobileNorm.startsWith(query);
        }).slice(0, 8);

        if (matches.length === 0) {
          suggestions.innerHTML = '<div class="suggestions-empty">No matching mobile found</div>';
          suggestions.classList.add('visible');
          return;
        }

        // Show only the mobile number - NOT the name
        suggestions.innerHTML = matches.map((m, i) => 
          '<div class="suggestion-item" data-index="' + i + '">' +
          '<div>' + escapeHtml(normalizeMobile(m.mobile)) + '</div>' +
          '</div>'
        ).join('');
        suggestions.classList.add('visible');

        suggestions.querySelectorAll('.suggestion-item').forEach((item, i) => {
          item.addEventListener('click', () => {
            input.value = normalizeMobile(matches[i].mobile);
            suggestions.classList.remove('visible');
          });
        });
      });

      input.addEventListener('blur', () => {
        setTimeout(() => suggestions.classList.remove('visible'), 200);
      });
    }

    // Normalize mobile - strip spaces, +91, dashes, leading 0
    function normalizeMobile(mobile) {
      if (!mobile) return '';
      let digits = String(mobile).replace(/\D/g, '');
      if (digits.length === 12 && digits.startsWith('91')) digits = digits.substring(2);
      if (digits.length === 11 && digits.startsWith('0')) digits = digits.substring(1);
      return digits;
    }

    // Verify name + mobile come from the same member record in Fitness Studio Tracker
    // Returns {valid: true} OR {valid: false, error: "..."}
    // Three scenarios handled:
    //   1. Member has mobile + entered empty → "Please enter your mobile number."
    //   2. Member has mobile + entered wrong → "Name and mobile number do not match..."
    //   3. Member has no mobile + entered something → "Our records do not have mobile number for [Name]..."
    //   Pass: member has mobile + matches; OR member has no mobile + field empty
    function verifyNameAndMobile(name, mobile) {
      // There may be MORE THAN ONE member with the same name (different
      // mobiles). The pair is valid if it matches ANY one of them exactly.
      const sameName = members.filter(m => m.name === name);
      if (sameName.length === 0) {
        return { valid: false, error: 'Member not found. Please select your name from suggestions.' };
      }

      const enteredNorm = normalizeMobile(mobile);
      const enteredEmpty = enteredNorm === '';

      for (const member of sameName) {
        const hasMobileOnFile = member.mobile && String(member.mobile).trim() !== '';
        if (hasMobileOnFile && !enteredEmpty &&
            normalizeMobile(member.mobile) === enteredNorm) {
          return { valid: true };
        }
        if (!hasMobileOnFile && enteredEmpty) {
          return { valid: true };
        }
      }

      const anyHasMobile = sameName.some(m => m.mobile && String(m.mobile).trim() !== '');
      if (anyHasMobile && enteredEmpty) {
        return { valid: false, error: 'Please enter your mobile number.' };
      }
      if (!anyHasMobile && !enteredEmpty) {
        return { valid: false, error: 'Our records do not have mobile number for ' + name + '. Please keep the mobile field empty to submit. Contact Sneha if you would like your number added.' };
      }
      return { valid: false, error: 'Name and mobile number do not match our records. Please correct whichever is wrong \u2014 name or mobile \u2014 and click on submit.' };
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => 
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
      );
    }

    function showStatus(statusId, type, message) {
      const el = document.getElementById(statusId);
      el.className = 'status visible ' + type;
      el.innerHTML = (type === 'loading' ? '<span class="spinner"></span>' : '') + message;
    }

    async function submitAttendance() {
      const name = document.getElementById('name-att').value.trim();
      const mobile = document.getElementById('mobile-att').value.trim();
      const batch = document.getElementById('batch-att').value;

      if (members.length === 0) { 
        showStatus('status-att', 'error', 'Member list not loaded yet. Please wait or refresh.'); 
        return; 
      }
      if (!name) { showStatus('status-att', 'error', 'Please enter your name'); return; }
      if (!members.some(m => m.name === name)) {
        showStatus('status-att', 'error', 'Please select your name from suggestions');
        return;
      }
      
      const check = verifyNameAndMobile(name, mobile);
      if (!check.valid) {
        showStatus('status-att', 'error', check.error);
        return;
      }
      
      if (!batch) { showStatus('status-att', 'error', 'Please select your batch'); return; }

      showStatus('status-att', 'loading', 'Marking attendance...');

      const submitBtn = document.getElementById('submit-att');
      submitBtn.disabled = true;
      let succeeded = false;

      try {
        const formData = new URLSearchParams();
        formData.append('action', 'attendance');
        formData.append('name', name);
        formData.append('mobile', normalizeMobile(mobile));
        formData.append('batch', batch);

        const res = await fetch(APPS_SCRIPT_URL + '?action=attendance', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.success) {
          succeeded = true;
          showStatus('status-att', 'success', '✓ Attendance marked successfully!');
          document.getElementById('name-att').value = '';
          document.getElementById('mobile-att').value = '';
          document.getElementById('batch-att').value = '';
        } else if (data.duplicate) {
          showStatus('status-att', 'error', '⚠️ You have already marked attendance today.');
        } else {
          showStatus('status-att', 'error', data.error || 'Submission failed. Please try again.');
        }
      } catch (err) {
        showStatus('status-att', 'error', 'Network error. Please check your connection and try again.');
      } finally {
        // On success, keep the button locked briefly so a reflex double-tap
        // can't fire a second (pointless) request; otherwise re-enable now.
        if (succeeded) {
          setTimeout(function () { submitBtn.disabled = false; }, 2000);
        } else {
          submitBtn.disabled = false;
        }
      }
    }

    async function submitAbsence() {
      const name = document.getElementById('name-abs').value.trim();
      const mobile = document.getElementById('mobile-abs').value.trim();
      const batch = document.getElementById('batch-abs').value;
      const absenceType = document.querySelector('input[name="absence-type"]:checked').value;

      if (members.length === 0) { 
        showStatus('status-abs', 'error', 'Member list not loaded yet. Please wait or refresh.'); 
        return; 
      }
      if (!name) { showStatus('status-abs', 'error', 'Please enter your name'); return; }
      if (!members.some(m => m.name === name)) {
        showStatus('status-abs', 'error', 'Please select your name from suggestions');
        return;
      }
      
      const check = verifyNameAndMobile(name, mobile);
      if (!check.valid) {
        showStatus('status-abs', 'error', check.error);
        return;
      }
      
      if (!batch) { showStatus('status-abs', 'error', 'Please select your batch'); return; }

      let datesToSubmit = [];
      const todayStr = localDateStr(new Date());
      const todayMidnight = parseLocalDate(todayStr);

      if (absenceType === 'today') {
        datesToSubmit.push(todayStr);
      } else {
        const fromStr = document.getElementById('date-from').value;
        const toStr = document.getElementById('date-to').value;
        if (!fromStr || !toStr) { 
          showStatus('status-abs', 'error', 'Please select both From and To dates'); 
          return; 
        }
        const fromDate = parseLocalDate(fromStr);
        const toDate = parseLocalDate(toStr);
        if (fromDate > toDate) {
          showStatus('status-abs', 'error', '"From" date must be on or before "To" date');
          return;
        }
        // Block back-dated absence: you cannot report absence for a day that
        // has already passed. Only today or future dates are allowed.
        if (fromDate < todayMidnight) {
          showStatus('status-abs', 'error', 'You cannot report absence for a date that has already passed. Please pick today or a future date.');
          return;
        }
        const current = new Date(fromDate);
        while (current <= toDate) {
          datesToSubmit.push(localDateStr(current));
          current.setDate(current.getDate() + 1);
        }
        if (datesToSubmit.length > 60) {
          showStatus('status-abs', 'error', 'Date range cannot exceed 60 days');
          return;
        }
      }

      const dayCount = datesToSubmit.length;
      showStatus('status-abs', 'loading', 'Submitting absence for ' + dayCount + ' day' + (dayCount > 1 ? 's' : '') + '...');

      const submitBtn = document.getElementById('submit-abs');
      submitBtn.disabled = true;
      let succeeded = false;

      try {
        const formData = new URLSearchParams();
        formData.append('action', 'absence');
        formData.append('name', name);
        formData.append('mobile', normalizeMobile(mobile));
        formData.append('batch', batch);
        formData.append('dates', datesToSubmit.join(','));

        const res = await fetch(APPS_SCRIPT_URL + '?action=absence', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.success) {
          succeeded = true;
          let msg;
          if ((data.skipped && data.skipped > 0) || (data.invalid && data.invalid > 0) || (data.past && data.past > 0)) {
            msg = '✓ Absence reported for ' + data.added + ' day(s).';
            if (data.skipped && data.skipped > 0) msg += ' ' + data.skipped + ' already marked.';
            if (data.past && data.past > 0) msg += ' ' + data.past + ' past date(s) skipped.';
            if (data.invalid && data.invalid > 0) msg += ' ' + data.invalid + ' had an invalid date.';
          } else {
            msg = dayCount === 1 
              ? '✓ Absence reported successfully for today!'
              : '✓ Absence reported successfully for ' + dayCount + ' days!';
          }
          showStatus('status-abs', 'success', msg);
          document.getElementById('name-abs').value = '';
          document.getElementById('mobile-abs').value = '';
          document.getElementById('batch-abs').value = '';
          selectAbsenceType('today');
        } else {
          showStatus('status-abs', 'error', data.error || 'Submission failed. Please try again.');
        }
      } catch (err) {
        showStatus('status-abs', 'error', 'Network error. Please check your connection and try again.');
      } finally {
        if (succeeded) {
          setTimeout(function () { submitBtn.disabled = false; }, 2000);
        } else {
          submitBtn.disabled = false;
        }
      }
    }

    // Initialize
    setToday();
    loadMembers();
    setupNameAutocomplete('name-att', 'suggestions-att');
    setupNameAutocomplete('name-abs', 'suggestions-abs');
    setupMobileAutocomplete('mobile-att', 'mob-suggestions-att', 'name-att');
    setupMobileAutocomplete('mobile-abs', 'mob-suggestions-abs', 'name-abs');
  </script>
