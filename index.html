<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F3F1F" />
  <title>Ritatva Fitness Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #F5F1E8 0%, #FFFFFF 100%);
      min-height: 100vh;
      color: #1a1a1a;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    /* Header */
    .header {
      background: #0F3F1F;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(15, 63, 31, 0.15);
    }
    .header h1 {
      color: #C9A86A;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .header p {
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Mode tabs */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #FFFFFF;
      border: 2px solid #E8E2D0;
      border-radius: 14px;
      padding: 6px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 14px 12px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #666666;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #0F3F1F;
      color: #FFFFFF;
    }

    /* Form card */
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    .form-title {
      font-size: 18px;
      font-weight: 700;
      color: #0F3F1F;
      margin-bottom: 6px;
    }
    .form-subtitle {
      font-size: 13px;
      color: #666666;
      margin-bottom: 20px;
    }

    /* Inputs */
    .field { margin-bottom: 16px; position: relative; }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .input, .select {
      width: 100%;
      padding: 14px 14px;
      border: 1.5px solid #E5E0D0;
      border-radius: 10px;
      font-size: 16px;
      color: #1a1a1a;
      background: #FFFFFF;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .input:focus, .select:focus {
      outline: none;
      border-color: #0F3F1F;
      box-shadow: 0 0 0 3px rgba(15, 63, 31, 0.1);
    }
    .input.locked {
      background: #F5F1E8;
      color: #666666;
      pointer-events: none;
    }

    /* Suggestions dropdown */
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1.5px solid #E5E0D0;
      border-radius: 10px;
      margin-top: 4px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      display: none;
    }
    .suggestions.visible { display: block; }
    .suggestion-item {
      padding: 12px 14px;
      font-size: 15px;
      cursor: pointer;
      border-bottom: 1px solid #F5F1E8;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover, .suggestion-item.highlighted {
      background: #F5F1E8;
      color: #0F3F1F;
    }
    .suggestion-item .mobile {
      font-size: 12px;
      color: #999999;
      margin-top: 2px;
    }
    .suggestions-empty {
      padding: 16px;
      text-align: center;
      color: #999999;
      font-size: 14px;
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #0F3F1F;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    /* Status messages */
    .status {
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 16px;
      text-align: center;
      display: none;
    }
    .status.visible { display: block; }
    .status.success {
      background: #E8F5E8;
      color: #1E6B3A;
      border: 1px solid #C9E5C9;
    }
    .status.error {
      background: #FDECEA;
      color: #C73E1D;
      border: 1px solid #F5C2B8;
    }
    .status.loading {
      background: #F5F1E8;
      color: #666666;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #999999;
      border-top-color: #0F3F1F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 24px;
      padding: 16px;
      font-size: 12px;
      color: #999999;
    }

    /* Today's date display */
    .today {
      background: #F5F1E8;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #666666;
      margin-bottom: 16px;
      text-align: center;
    }
    .today strong { color: #0F3F1F; }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>RITATVA</h1>
      <p>FITNESS STUDIO</p>
    </div>

    <div class="mode-tabs">
      <button class="tab-btn active" data-mode="attendance" onclick="switchMode('attendance')">
        ✓ I'm Here Today
      </button>
      <button class="tab-btn" data-mode="absence" onclick="switchMode('absence')">
        ✗ Can't Attend
      </button>
    </div>

    <div class="card">
      <div id="form-attendance">
        <div class="form-title">Mark Attendance</div>
        <div class="form-subtitle">Scan complete — fill below to mark your presence</div>
        <div class="today">Today is <strong id="today-date-1"></strong></div>

        <div class="field">
          <label class="label">Your Name</label>
          <input type="text" id="name-att" class="input" autocomplete="off" placeholder="Type 2-3 letters of your name..." />
          <div class="suggestions" id="suggestions-att"></div>
        </div>

        <div class="field">
          <label class="label">Mobile Number</label>
          <input type="text" id="mobile-att" class="input locked" readonly placeholder="Auto-filled after name selection" />
        </div>

        <div class="field">
          <label class="label">Your Batch</label>
          <select id="batch-att" class="select">
            <option value="">Select batch</option>
            <option value="6am">6:00 AM</option>
            <option value="7am">7:00 AM</option>
            <option value="8am">8:00 AM</option>
            <option value="9am">9:00 AM</option>
          </select>
        </div>

        <button class="submit-btn" onclick="submitAttendance()">Mark My Attendance ✓</button>
        <div class="status" id="status-att"></div>
      </div>

      <div id="form-absence" style="display:none;">
        <div class="form-title">Report Absence</div>
        <div class="form-subtitle">Let us know you can't attend</div>

        <div class="field">
          <label class="label">Your Name</label>
          <input type="text" id="name-abs" class="input" autocomplete="off" placeholder="Type 2-3 letters of your name..." />
          <div class="suggestions" id="suggestions-abs"></div>
        </div>

        <div class="field">
          <label class="label">Mobile Number</label>
          <input type="text" id="mobile-abs" class="input locked" readonly placeholder="Auto-filled after name selection" />
        </div>

        <div class="field">
          <label class="label">Date You Won't Attend</label>
          <input type="date" id="date-abs" class="input" />
        </div>

        <div class="field">
          <label class="label">Your Batch</label>
          <select id="batch-abs" class="select">
            <option value="">Select batch</option>
            <option value="6am">6:00 AM</option>
            <option value="7am">7:00 AM</option>
            <option value="8am">8:00 AM</option>
            <option value="9am">9:00 AM</option>
          </select>
        </div>

        <button class="submit-btn" onclick="submitAbsence()">Submit Absence</button>
        <div class="status" id="status-abs"></div>
      </div>
    </div>

    <div class="footer">
      For queries, contact Sneha directly via WhatsApp
    </div>

  </div>

  <script>
    // ========================================
    // CONFIGURATION - PASTE YOUR APPS SCRIPT URL HERE
    // ========================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycCHMczSJnIcP7ae6lD2aZCgGh7ajaTzeAlXFglgontnFNTdXjoNgnM3xikW22PK7-/exec";

    // ========================================
    // MEMBER DATA - Auto-loaded from Apps Script
    // ========================================
    let members = []; // Will be filled with {name, mobile} objects

    // Set today's date
    function setToday() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const display = dd + " " + monthNames[today.getMonth()] + " " + yyyy;
      document.getElementById('today-date-1').textContent = display;
      // Default absence date to tomorrow
      const tomorrow = new Date(today);
      tomorrow.setDate(today.getDate() + 1);
      document.getElementById('date-abs').value = tomorrow.toISOString().split('T')[0];
    }

    // Switch between attendance and absence modes
    function switchMode(mode) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-mode="' + mode + '"]').classList.add('active');
      document.getElementById('form-attendance').style.display = mode === 'attendance' ? 'block' : 'none';
      document.getElementById('form-absence').style.display = mode === 'absence' ? 'block' : 'none';
    }

    // Load members from Apps Script
    async function loadMembers() {
      try {
        const res = await fetch(APPS_SCRIPT_URL + '?action=getMembers');
        const data = await res.json();
        if (data.members) {
          members = data.members;
        }
      } catch (err) {
        console.error('Failed to load members:', err);
      }
    }

    // Setup autocomplete for a given input
    function setupAutocomplete(inputId, suggestionsId, mobileId) {
      const input = document.getElementById(inputId);
      const suggestions = document.getElementById(suggestionsId);
      const mobileInput = document.getElementById(mobileId);
      let selectedIndex = -1;
      let matches = [];

      input.addEventListener('input', () => {
        const query = input.value.toLowerCase().trim();
        mobileInput.value = ''; // Clear mobile when typing
        
        if (query.length < 2) {
          suggestions.classList.remove('visible');
          suggestions.innerHTML = '';
          return;
        }

        matches = members.filter(m => 
          m.name.toLowerCase().includes(query)
        ).slice(0, 8);

        if (matches.length === 0) {
          suggestions.innerHTML = '<div class="suggestions-empty">No matching member found</div>';
          suggestions.classList.add('visible');
          return;
        }

        suggestions.innerHTML = matches.map((m, i) => 
          '<div class="suggestion-item" data-index="' + i + '">' +
          '<div>' + escapeHtml(m.name) + '</div>' +
          (m.mobile ? '<div class="mobile">' + escapeHtml(m.mobile) + '</div>' : '') +
          '</div>'
        ).join('');
        suggestions.classList.add('visible');
        selectedIndex = -1;

        suggestions.querySelectorAll('.suggestion-item').forEach((item, i) => {
          item.addEventListener('click', () => {
            input.value = matches[i].name;
            mobileInput.value = matches[i].mobile || '';
            suggestions.classList.remove('visible');
          });
        });
      });

      input.addEventListener('blur', () => {
        setTimeout(() => suggestions.classList.remove('visible'), 200);
      });

      input.addEventListener('focus', () => {
        if (input.value.trim().length >= 2 && suggestions.innerHTML) {
          suggestions.classList.add('visible');
        }
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => 
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
      );
    }

    function showStatus(statusId, type, message) {
      const el = document.getElementById(statusId);
      el.className = 'status visible ' + type;
      el.innerHTML = (type === 'loading' ? '<span class="spinner"></span>' : '') + message;
    }

    function hideStatus(statusId) {
      document.getElementById(statusId).className = 'status';
    }

    async function submitAttendance() {
      const name = document.getElementById('name-att').value.trim();
      const mobile = document.getElementById('mobile-att').value.trim();
      const batch = document.getElementById('batch-att').value;

      if (!name) { showStatus('status-att', 'error', 'Please enter your name'); return; }
      if (!members.some(m => m.name === name)) {
        showStatus('status-att', 'error', 'Please select your name from suggestions');
        return;
      }
      if (!batch) { showStatus('status-att', 'error', 'Please select your batch'); return; }

      showStatus('status-att', 'loading', 'Marking attendance...');

      try {
        const formData = new URLSearchParams();
        formData.append('action', 'attendance');
        formData.append('name', name);
        formData.append('mobile', mobile);
        formData.append('batch', batch);

        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.success) {
          showStatus('status-att', 'success', '✓ Attendance marked successfully!');
          // Clear form
          document.getElementById('name-att').value = '';
          document.getElementById('mobile-att').value = '';
          document.getElementById('batch-att').value = '';
        } else {
          showStatus('status-att', 'error', data.error || 'Submission failed. Please try again.');
        }
      } catch (err) {
        showStatus('status-att', 'error', 'Network error. Please check your connection and try again.');
      }
    }

    async function submitAbsence() {
      const name = document.getElementById('name-abs').value.trim();
      const mobile = document.getElementById('mobile-abs').value.trim();
      const date = document.getElementById('date-abs').value;
      const batch = document.getElementById('batch-abs').value;

      if (!name) { showStatus('status-abs', 'error', 'Please enter your name'); return; }
      if (!members.some(m => m.name === name)) {
        showStatus('status-abs', 'error', 'Please select your name from suggestions');
        return;
      }
      if (!date) { showStatus('status-abs', 'error', 'Please select the date'); return; }
      if (!batch) { showStatus('status-abs', 'error', 'Please select your batch'); return; }

      showStatus('status-abs', 'loading', 'Submitting absence...');

      try {
        const formData = new URLSearchParams();
        formData.append('action', 'absence');
        formData.append('name', name);
        formData.append('mobile', mobile);
        formData.append('date', date);
        formData.append('batch', batch);

        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.success) {
          showStatus('status-abs', 'success', '✓ Absence reported successfully!');
          document.getElementById('name-abs').value = '';
          document.getElementById('mobile-abs').value = '';
          document.getElementById('batch-abs').value = '';
        } else {
          showStatus('status-abs', 'error', data.error || 'Submission failed. Please try again.');
        }
      } catch (err) {
        showStatus('status-abs', 'error', 'Network error. Please check your connection and try again.');
      }
    }

    // Initialize
    setToday();
    loadMembers();
    setupAutocomplete('name-att', 'suggestions-att', 'mobile-att');
    setupAutocomplete('name-abs', 'suggestions-abs', 'mobile-abs');
  </script>

</body>
</html>
